- id: imagenet-dataset
  date: 2009-06
  title: ImageNet dataset introduced, setting the stage for deep learning in vision
  category: foundations
  field: Computer vision datasets
  system: ImageNet (Fei-Fei Li, Kai Li and colleagues, Princeton University; later Stanford)
  summary: >-
    At CVPR 2009, Jia Deng, Wei Dong, Richard Socher, Li-Jia Li, Kai Li and Fei-Fei Li presented ImageNet,
    a large image database organized by the noun hierarchy of WordNet. Fei-Fei Li had started the project
    in 2006 at Princeton. Images were labeled by about 49,000 Amazon Mechanical Turk workers in 167 countries.
    By April 2010 it held about 14.2 million images across 21,841 categories. The annual ImageNet Large
    Scale Visual Recognition Challenge, with 1,000 classes, began in 2010.
  significance: >-
    ImageNet supplied the scale of labeled data that deep networks needed, and its challenge became the
    benchmark where AlexNet's 2012 win started the deep learning era.
