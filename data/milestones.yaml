- id: alvinn-navlab
  date: '1989'
  title: ALVINN neural network learns to steer CMU's Navlab van
  category: robotics
  field: Autonomous driving
  system: ALVINN on Navlab 1 (Dean Pomerleau, Carnegie Mellon University Robotics Institute)
  summary: >-
    Dean Pomerleau's ALVINN was a three-layer network trained with backpropagation. It took a 30x32 camera
    image plus a laser rangefinder input, mapped them through 29 hidden units, and output one of 45 steering
    directions. It was trained first on simulated road images. On Carnegie Mellon's Navlab 1 van it followed
    a wooded path, and it set a speed record of 1.3 m/s in March 1989. By June 1989 it could learn to
    follow a road from about ten minutes of watching a human drive.
  significance: >-
    It was one of the first vehicles steered by a neural network that learned to drive from examples,
    an early form of the end-to-end approach used in self-driving research today.
  image: null
  sources:
  - title: 'ALVINN: An Autonomous Land Vehicle in a Neural Network (NIPS 1, 1988)'
    publisher: Advances in Neural Information Processing Systems
    url: https://proceedings.neurips.cc/paper/1988/hash/812b4ba287f5ee0bc9d43bbf5bbe87fb-Abstract.html
    kind: paper
  - title: Navlab
    publisher: Wikipedia
    url: https://en.wikipedia.org/wiki/Navlab
    kind: reference
  - title: Look, Ma, No Hands! (1995 Navlab 5 cross-country trip retrospective)
    publisher: Carnegie Mellon University
    url: https://www.cmu.edu/news/stories/archives/2015/july/look-ma-no-hands.html
    kind: primary
  notes: >-
    The paper was presented at NIPS 1988, with proceedings dated 1988/89. The 1989 date follows the on-vehicle
    results (the March and June 1989 milestones per Wikipedia). Early speeds were very slow, 0.5-1.3 m/s.
    The 1995 "No Hands Across America" trip, 2,800 of 2,850 miles steered autonomously, used RALPH, ALVINN's
    successor. Ernst Dickmanns' VaMoRs van in Germany drove itself at up to 96 km/h by 1987 using classical
    vision rather than learning; it could be its own entry, but it is not fully sourced here. Image suggestion:
    a free Commons photo of Navlab 1 or Navlab 5 (not verified).

- id: lecun-convnet-zip-codes
  date: 1989-12
  title: LeCun's convolutional network reads handwritten ZIP codes
  category: perception
  field: Handwriting recognition
  system: >-
    Convolutional network, later named LeNet (Yann LeCun, Bernhard Boser, John Denker, Donnie Henderson,
    Richard Howard, Wayne Hubbard, Lawrence Jackel; AT&T Bell Labs)
  summary: >-
    At AT&T Bell Labs, Yann LeCun and colleagues trained a convolutional neural network end to end with
    backpropagation, learning shared-weight feature detectors directly from pixels. The data were 9,298
    handwritten digit images (16x16) cut from ZIP codes on mail passing through the Buffalo, NY post office,
    split 7,291 for training and 2,007 for testing. They published the work in Neural Computation (vol.
    1, no. 4) in December 1989. Humans averaged about 2.5% error on the same test set.
  significance: >-
    It set out the convolutional-network design behind modern computer vision, and its descendants were
    reading about 10% of U.S. checks by around 2001.
  image:
    file: MnistExamples.png
    alt: Sample handwritten digits from the MNIST dataset
  sources:
  - title: Backpropagation Applied to Handwritten Zip Code Recognition (Neural Computation 1(4):541-551)
    publisher: Neural Computation (MIT Press)
    url: https://doi.org/10.1162/neco.1989.1.4.541
    kind: paper
  - title: LeNet
    publisher: Wikipedia
    url: https://en.wikipedia.org/wiki/LeNet
    kind: reference
  notes: >-
    Wikipedia gives 1% error at about 9% rejection for the companion 1989 NIPS paper. The raw test error
    in the Neural Computation paper was not confirmed, so the summary leaves it out. The check readers
    deployed by NCR from 1996 mainly used the 1998 LeNet-5. Fukushima's Neocognitron (1980) was an earlier
    convolution-like architecture that was not trained by backprop. The DOI page could not be fetched;
    the citation comes from Wikipedia. Image suggestion: the MNIST sample grid on Commons (a later, related
    dataset) or a free LeCun portrait (not verified).

- id: td-gammon-self-play
  date: '1992'
  title: TD-Gammon teaches itself near-world-class backgammon through self-play
  category: games
  field: Backgammon
  system: TD-Gammon (Gerald Tesauro, IBM Research)
  opponent: Bill Robertie and other top backgammon players (exhibition games)
  summary: >-
    Gerald Tesauro at IBM's T. J. Watson Research Center trained a neural network to play backgammon using
    temporal-difference learning, TD(lambda). It learned mostly from games against itself, plus a set
    of hand-designed input features. Version 2.0 had trained on about 800,000 self-play games and searched
    2 ply. It made its debut at the 1992 World Cup of Backgammon, where it played 38 exhibition games
    against top players and lost by a net 7 points. Version 2.1, after about 1.5 million self-play games,
    played Bill Robertie over 40 games and finished only 1 point behind.
  significance: >-
    It was the first striking evidence that reinforcement learning by self-play could reach near-expert
    human strength in a complex game. Its move choices changed how human experts played certain opening
    rolls.
  image:
    file: Backgammon board.jpg
    alt: A backgammon board
  sources:
  - title: TD-Gammon, A Self-Teaching Backgammon Program, Achieves Master-Level Play
    publisher: IBM Research (AAAI Fall Symposium 1993)
    url: >-
      https://research.ibm.com/publications/td-gammon-a-self-teaching-backgammon-program-achieves-master-level-play
    kind: paper
  - title: >-
      TD-Gammon, a Self-Teaching Backgammon Program, Achieves Master-Level Play (Neural Computation 6(2):215-219,
      1994; DOI 10.1162/neco.1994.6.2.215)
    publisher: ML Anthology / Neural Computation
    url: https://mlanthology.org/neco/1994/tesauro1994neco-tdgammon
    kind: paper
  - title: Temporal Difference Learning and TD-Gammon (Communications of the ACM 38(3), March 1995)
    publisher: bkgm.com (reprint of Tesauro's CACM article)
    url: https://bkgm.com/articles/tesauro/tdl.html
    kind: paper
  - title: TD-Gammon
    publisher: Wikipedia
    url: https://en.wikipedia.org/wiki/TD-Gammon
    kind: reference
  notes: >-
    Date: 1992 is the World Cup of Backgammon debut of v2.0. Work began in 1991 (v0.0/v1.0), and the "master-level"
    papers appeared in Oct 1993 (AAAI Fall Symposium) and 1994 (Neural Computation). The 40-game Robertie
    session for v2.1 is undated in the sources (probably 1993). "Near world-champion" is Robertie's own
    judgment, not a match win. In 1998, v3.1 lost a 100-game series to world champion Malcolm Davis by
    8 points. Image candidates (unverified on Commons): "Backgammon lg.jpg" (public domain, by Ptkfgs)
    or "Backgammon board.jpg" (GFDL 1.2+ / CC BY-SA 3.0, by Bdevel).

- id: chinook-man-machine-champion
  date: '1994-08-18'
  title: Chinook becomes Man-Machine World Checkers Champion
  category: games
  field: Checkers
  system: Chinook (Jonathan Schaeffer and team, University of Alberta)
  opponent: Marion Tinsley, world checkers champion (withdrew after six drawn games)
  summary: >-
    The 1994 Man vs. Machine World Checkers Championship was held at the Computer Museum in Boston, starting
    on 15 August. It was a rematch between Marion Tinsley, who had beaten Chinook 4-2 with 33 draws in
    1992, and the University of Alberta program led by Jonathan Schaeffer. The first six games were all
    drawn. On 18 August Tinsley resigned the match and the title for health reasons, and the organizers
    declared Chinook champion. Chinook then drew a 20-game match with Don Lafferty 1-1, and it defended
    the title again in 1995.
  significance: This was the first time a computer program held a human world championship title in a
    game of skill.
  image:
    file: Marion Tinsley.jpg
    alt: Checkers champion Marion Tinsley
  sources:
  - title: 1994 Man vs. Machine World Championship (match description)
