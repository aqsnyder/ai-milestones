- id: alexnet-imagenet-2012
  date: '2012-10-13'
  title: AlexNet wins ImageNet challenge by a huge margin, igniting deep learning
  category: perception
  field: Image classification
  system: AlexNet / SuperVision (Krizhevsky, Sutskever, Hinton; University of Toronto)
  summary: >-
    Alex Krizhevsky, Ilya Sutskever and Geoffrey Hinton of the University of Toronto entered a deep convolutional
    neural network, trained on two NVIDIA GTX 580 GPUs, in the 2012 ImageNet Large Scale Visual Recognition
    Challenge as team "SuperVision". On the 1,000-category classification task its top-5 error was 15.3%,
    against 26.2% for the next-best team (ISI). The result was presented at the ECCV 2012 workshop in
    Florence, and the method was published at NIPS 2012.
  significance: >-
    The roughly 11-point winning margin persuaded the computer-vision field to adopt deep neural networks
    trained on GPUs, setting off the modern deep-learning boom.
  image: null
