  title: AlphaGeometry solves olympiad geometry near gold-medalist level
  category: math
  field: Geometry
  system: AlphaGeometry (Google DeepMind)
  summary: >-
    Google DeepMind's AlphaGeometry combines a language model, which proposes auxiliary constructions,
    with a symbolic deduction engine. It was trained on 100 million synthetic proofs and no human demonstrations.
    On a benchmark of 30 IMO geometry problems from 2000-2022 it solved 25 within competition time limits.
    The previous best automated method (Wu's method) solved 10, and the average human gold medalist solved
    about 25.9.
  significance: >-
    Machine reasoning reached roughly the level of the best high-school mathematicians in one olympiad
    domain, a step toward the IMO "grand challenge."
