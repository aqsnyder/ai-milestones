- id: transformer-attention-is-all-you-need
  date: '2017-06-12'
  title: '"Attention Is All You Need" introduces the Transformer'
  category: foundations
  field: Neural network architecture / NLP
  system: Transformer (Vaswani et al., Google)
  summary: >-
    Eight Google researchers proposed the Transformer, a sequence-to-sequence model built entirely from
    attention mechanisms, with no recurrence or convolution. The authors were Ashish Vaswani, Noam Shazeer,
    Niki Parmar, Jakob Uszkoreit, Llion Jones, Aidan Gomez, Łukasz Kaiser and Illia Polosukhin. The model
    set machine-translation records on WMT 2014 (28.4 BLEU English-German, 41.8 BLEU English-French) and
    trained much faster than earlier models; the English-French model took 3.5 days on eight GPUs. The
    paper was posted to arXiv on 12 June 2017 and presented at NIPS 2017.
  significance: >-
    The Transformer became the architecture behind BERT, GPT and nearly every later large language model,
    making this the foundational paper of the LLM era.
  image:
    file: Transformer, full architecture.png
    alt: Diagram of the Transformer architecture
  sources:
  - title: Attention Is All You Need
    publisher: arXiv (Vaswani et al.; NIPS 2017)
    url: https://arxiv.org/abs/1706.03762
    kind: paper
  - title: Attention Is All You Need
    publisher: Wikipedia
    url: https://en.wikipedia.org/wiki/Attention_Is_All_You_Need
    kind: reference
  notes: >-
    Wikipedia reports more than 250,000 citations by 2026. Only two sources here because the web search
    budget ran out. A NIPS proceedings URL would be a good primary to add. Wikipedia says all eight authors
    were at Google when the paper was written, and all later left Google. IMAGE: none confirmed. A freely
    licensed Transformer architecture diagram on Commons would suit, but none was checked in this pass.

- id: alphago-zero
  date: '2017-10-18'
  title: AlphaGo Zero masters Go from scratch with no human data
  category: games
  field: Go
  system: AlphaGo Zero (Google DeepMind)
  summary: >-
    DeepMind's AlphaGo Zero learned Go entirely by playing against itself. It started from random moves,
    knew only the rules and saw no human game records. After three days of self-play it beat the version
    that defeated Lee Sedol by 100 games to 0, and after 40 days it surpassed AlphaGo Master, the version
    that beat Ke Jie. It used one combined neural network, no rollouts and just 4 TPUs.
  significance: >-
    Showed that superhuman skill in a famously hard domain could be reached with no human knowledge beyond
    the rules.
