- id: he-prelu-surpasses-human-imagenet
  date: '2015-02-06'
  title: Microsoft network edges past reported human error rate on ImageNet
  category: perception
  field: Image classification
  system: PReLU-net (Microsoft Research)
  summary: >-
    Kaiming He, Xiangyu Zhang, Shaoqing Ren and Jian Sun of Microsoft Research reported a top-5 error
    of 4.94% on the ImageNet 2012 classification benchmark. They used deep networks with a new learnable
    activation function (PReLU) and a better weight-initialization scheme. That beat the 5.1% previously
    measured for a trained human annotator and the 6.66% of GoogLeNet, the 2014 challenge winner.
  significance: >-
    The first published claim that a machine beat measured human accuracy at large-scale, 1,000-category
    image recognition.
  image: null
  sources:
  - title: 'Delving Deep into Rectifiers: Surpassing Human-Level Performance on ImageNet Classification'
    publisher: arXiv (He, Zhang, Ren, Sun)
    url: https://www.arxiv.org/abs/1502.01852
    kind: paper
  - title: 'Delving Deep into Rectifiers: Surpassing Human-Level Performance on ImageNet Classification'
    publisher: Microsoft Research
    url: >-
      https://www.microsoft.com/en-us/research/publication/delving-deep-into-rectifiers-surpassing-human-level-performance-on-imagenet-classification/
    kind: primary
  - title: ImageNet
    publisher: Wikipedia
    url: https://en.wikipedia.org/wiki/ImageNet
    kind: reference
  notes: >-
    The 5.1% "human-level" figure comes from one trained annotator (Andrej Karpathy) and appears in Russakovsky
    et al.'s ILSVRC paper. Wikipedia notes that untrained lab members scored about 12-13% and estimates
    maximal human effort at about 2.4%, so "superhuman" holds only in a narrow sense. Google's batch-normalization
    paper (Ioffe & Szegedy, arXiv 11 February 2015, https://arxiv.org/abs/1502.03167) reported 4.8% test
    error five days later. Microsoft's ResNet then won ILSVRC 2015 with 3.57%. The paper was published
    at ICCV 2015. IMAGE: none found.

- id: dqn-atari
  date: '2015-02-25'
  title: DeepMind's DQN learns to play dozens of Atari games at human level
  category: games
  field: Atari 2600 video games
  system: Deep Q-Network, DQN (Google DeepMind; Mnih, Kavukcuoglu, Silver, Hassabis et al.)
  summary: >-
    DeepMind's deep Q-network (DQN) learned to play 49 classic Atari 2600 games using only the screen
    pixels and the score as input, with the same network architecture and settings for every game. In
    the Nature paper it outperformed earlier learning methods on 43 games. On 29 of them it scored more
    than 75% of what a professional human games tester achieved.
  significance: >-
    Showed that a single deep reinforcement-learning agent could learn many different tasks from raw pixels
    to roughly human level, launching the deep-RL era that led to AlphaGo.
