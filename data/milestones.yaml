- id: ai-guides-mathematical-discovery
  date: '2021-12-01'
  title: AI guides mathematicians to new results in knot theory and representation theory
  category: math
  field: Knot theory / representation theory
  system: >-
    DeepMind machine-learning framework, with University of Oxford and University of Sydney mathematicians
  summary: >-
    DeepMind worked with mathematicians at Oxford (Marc Lackenby, András Juhász) and Sydney (Geordie Williamson),
    using machine learning to spot patterns and attribution methods to highlight which quantities mattered.
    In knot theory this led to a proven theorem linking a knot's algebraic signature to its geometry through
    a new quantity, the "natural slope". In representation theory it pointed toward a proposed proof route
    for the roughly 40-year-old combinatorial invariance conjecture for Kazhdan-Lusztig polynomials, which
    was checked on more than 3 million examples.
  significance: >-
