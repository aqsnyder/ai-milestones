# AI Milestones — the source of truth for the timeline.
# Edit this file, not README.md (which is generated from it). Format and inclusion rules: MAINTAINING.md
# `notes` are for maintainers only and are not shown in the README.

- id: turing-computing-machinery-intelligence
  date: 1950-10
  title: Turing publishes "Computing Machinery and Intelligence"
  category: foundations
  field: Philosophy of AI
  system: Alan Turing (University of Manchester)
  summary: >-
    In the October 1950 issue of the journal Mind (vol. 59, no. 236, pp. 433-460), Alan Turing proposed
    swapping the vague question "Can machines think?" for a concrete test, the "imitation game", in which
    an interrogator tries to tell a machine from a human over text. The paper also answers a list of objections
    to machine intelligence and argues that a learning "child machine" that is then educated may be the
    most practical route there.
  significance: >-
    It gave the field its first operational benchmark (the Turing test) and framed the research agenda
    years before the term "artificial intelligence" existed.
  image:
    file: Alan Turing Aged 16.jpg
    alt: Alan Turing at age 16
  sources:
  - title: I.—Computing Machinery and Intelligence
    publisher: Mind (Oxford University Press)
    url: https://doi.org/10.1093/mind/LIX.236.433
    kind: paper
  - title: Computing Machinery and Intelligence
    publisher: Wikipedia
    url: https://en.wikipedia.org/wiki/Computing_Machinery_and_Intelligence
    kind: reference
  notes: >-
    Image suggestion (unverified): "Alan Turing Aged 16.jpg" turned up in a site:commons.wikimedia.org
    search, but its file page and license could not be opened from this session. Check it before use.

- id: strachey-draughts-program
  date: '1952'
  title: Strachey's draughts program plays a full game on the Ferranti Mark 1
  category: games
  field: Draughts (checkers)
  system: Draughts program by Christopher Strachey (Ferranti Mark 1, University of Manchester)
  summary: >-
    Christopher Strachey wrote a draughts program in May 1951 for the NPL's Pilot ACE. It failed when
    first run there on 30 July 1951, so he rewrote it for the larger-memory Manchester machine. By summer
    1952 it could play a complete game against a human at a reasonable speed. It is generally counted
    among the first game-playing programs. Dietrich Prinz's Ferranti Mark 1 chess program, which first
    ran in November 1951, only solved mate-in-two problems.
  significance: >-
    One of the earliest programs to play a whole board game, and the starting point for Arthur Samuel's
    checkers work at IBM.
  image: null
  sources:
  - title: What is Artificial Intelligence? (AlanTuring.net reference articles)
    publisher: AlanTuring.net (Turing Archive for the History of Computing, B. J. Copeland)
    url: https://alanturing.net/turing_archive/pages/Reference%20Articles/what_is_AI/What%20is%20AI04.html
    kind: reference
  - title: Christopher Strachey
    publisher: Wikipedia
    url: https://en.wikipedia.org/wiki/Christopher_Strachey
    kind: reference
  notes: >-
    Sources mostly agree, but Wikipedia says "Manchester Mark 1" and AlanTuring.net says "Ferranti Mark
    I". The Ferranti machine was the commercial version installed at Manchester in 1951. Strachey's own
    1952 ACM paper is the primary source for the "complete game" quote, but no stable online copy was
    found. Lower priority than the other entries: drop it if space is tight. Image suggestion: a free
    photo of the Ferranti Mark 1 or of Strachey on Commons (not verified).

- id: georgetown-ibm-machine-translation
  date: '1954-01-07'
  title: Georgetown-IBM experiment gives first public machine-translation demo
  category: language
  field: Machine translation
  system: 'Georgetown-IBM system (Georgetown University: Leon Dostert, Paul Garvin; IBM 701)'
  summary: >-
    At IBM's New York headquarters on 7 January 1954, Georgetown University and IBM had an IBM 701 translate
    more than sixty Russian sentences into English (Hutchins counts 61). The system used a vocabulary
    of about 250 words and stems and just six syntax rules. The event made front-page news, and organizers
    and press forecast that practical machine translation was three to five years away.
  significance: >-
    It was the first public demonstration of machine translation, and it set off both MT funding and the
    field's first hype cycle. The ALPAC report cut that funding in 1966.
  image: null
  sources:
  - title: 'The first public demonstration of machine translation: the Georgetown-IBM system, 7th January
      1954'
    publisher: John Hutchins (2005/2006)
    url: http://www.hutchinsweb.me.uk/GU-IBM-2005.pdf
    kind: paper
  - title: Georgetown–IBM experiment
    publisher: Wikipedia
    url: https://en.wikipedia.org/wiki/Georgetown%E2%80%93IBM_experiment
    kind: reference
  notes: >-
    The demonstration sentences were carefully pre-selected and the system was a toy by later standards.
    Present it as a demonstration, not as a solution to the problem. Image suggestion: an IBM 701 photo
    on Commons (not verified).

- id: logic-theorist
  date: '1956-06-15'
  title: Logic Theorist proves theorems from Principia Mathematica
  category: math
  field: Theorem proving
  system: Logic Theorist (Allen Newell, Herbert A. Simon, J. C. Shaw; RAND Corporation)
  summary: >-
    Allen Newell, Herbert Simon and Cliff Shaw at RAND built the Logic Theorist, a program that searches
    for proofs in propositional logic using heuristics rather than brute force. It was first hand-simulated
    on index cards in January 1956. It went on to prove 38 of the first 52 theorems in Chapter 2 of Whitehead
    and Russell's Principia Mathematica, and for theorem 2.85 it found a proof shorter than the one in
    the book.
  significance: >-
    Often called the first artificial intelligence program, it showed a machine doing work that had been
    seen as uniquely human: discovering mathematical proofs.
  image: null
  sources:
  - title: 'The Logic Theory Machine: A Complex Information Processing System (RAND P-868)'
    publisher: RAND Corporation
    url: https://www.rand.org/pubs/papers/P868.html
    kind: primary
  - title: >-
      The logic theory machine–A complex information processing system (IRE Transactions on Information
      Theory, IT-2(3), 1956)
    publisher: IEEE Xplore
    url: https://ieeexplore.ieee.org/document/1056797
    kind: paper
  - title: Logic Theorist
    publisher: Wikipedia
    url: https://en.wikipedia.org/wiki/Logic_Theorist
    kind: reference
  notes: >-
    The date is that of RAND report P-868 (15 June 1956, per HistoryOfInformation.com; RAND's page gives
    only "1956"). The journal version appeared in September 1956, and the program was shown at the Dartmouth
    workshop that summer. The 38-of-52 figure comes from later runs. Wikipedia notes that theorem 2.85
    is numbered 2.53 in some editions of Principia. Russell reportedly welcomed the shorter proof, and
    the Journal of Symbolic Logic declined a paper co-credited to the program. Image suggestion: a photo
    of Newell and Simon or of RAND's JOHNNIAC (not verified).

- id: dartmouth-workshop
  date: '1956-06-18'
  title: Dartmouth workshop launches "artificial intelligence" as a field
  category: foundations
  field: AI research
  system: Dartmouth Summer Research Project on Artificial Intelligence (McCarthy, Minsky, Rochester, Shannon)
  summary: >-
    John McCarthy, Marvin Minsky, Nathaniel Rochester and Claude Shannon put the phrase "artificial intelligence"
    into a funding proposal dated 31 August 1955, for a two-month study built on the conjecture that every
    aspect of learning and intelligence could in principle be described precisely enough for a machine
    to simulate. The resulting summer project ran at Dartmouth College in Hanover, New Hampshire, roughly
    from 18 June to 17 August 1956.
  significance: It named the field and brought together the researchers who led it for the next two decades.
  image:
    file: >-
      A Proposal for the Dartmouth Summer Research Project on Artificial Intelligence, by John McCarthy
      et al, 1955.pdf
    alt: First page of the 1955 Dartmouth proposal that coined the term artificial intelligence
  sources:
  - title: >-
      A Proposal for the Dartmouth Summer Research Project on Artificial Intelligence, August 31, 1955
      (AI Magazine 27(4), 2006 reprint)
    publisher: AAAI / AI Magazine
    url: https://ojs.aaai.org/index.php/aimagazine/article/view/1904
    kind: primary
  - title: Dartmouth workshop
    publisher: Wikipedia
    url: https://en.wikipedia.org/wiki/Dartmouth_workshop
    kind: reference
  notes: >-
    Your date needed a fix: the term was coined in the 1955 proposal, and the workshop itself was in 1956.
    The 18 June to 17 August dates come from Ray Solomonoff's notes, as cited by Wikipedia and by a pending
    IEEE Milestone proposal. Image suggestion: Commons Category:Artificial intelligence lists a file named
    "A Proposal for the Dartmouth Summer Research Project on Artificial Intelligence, by John McCarthy
    et al, 1955.pdf", but its file page and license could not be opened. Verify it, or use a free photo
    of Dartmouth Hall.

- id: rosenblatt-perceptron
  date: 1958-07
  title: Rosenblatt's perceptron learns to recognize patterns
  category: foundations
  field: Neural networks
  system: Perceptron / Mark I Perceptron (Frank Rosenblatt, Cornell Aeronautical Laboratory; funded by
    ONR)
  summary: >-
    In July 1958 the U.S. Office of Naval Research unveiled Frank Rosenblatt's perceptron. A simulation
    running on an IBM 704 at the Cornell Aeronautical Laboratory taught itself, after about 50 trials,
    to tell punch cards marked on the left from cards marked on the right. The theory appeared in Psychological
    Review that year. The custom Mark I Perceptron hardware followed: a 20x20 grid of 400 photosensors
    wired at random to 512 association units, with learned weights stored in motor-driven potentiometers.
  significance: >-
    It was the first machine to learn a classification from examples, and it is the direct ancestor of
    today's neural networks.
  image: null
  sources:
  - title: Professor's perceptron paved the way for AI – 60 years too soon
    publisher: Cornell Chronicle
    url: https://news.cornell.edu/node/313946
    kind: news
  - title: Mark I Perceptron Operators' Manual (Project PARA), Report VG-1196-G-5, 15 Feb 1960
    publisher: Cornell Aeronautical Laboratory (via DTIC)
    url: https://apps.dtic.mil/sti/tr/pdf/AD0236965.pdf
    kind: primary
  - title: 'The perceptron: a probabilistic model for information storage and organization in the brain'
    publisher: Psychological Review (PubMed record)
    url: https://pubmed.ncbi.nlm.nih.gov/13602029/
    kind: paper
  - title: Perceptron
    publisher: Wikipedia
    url: https://en.wikipedia.org/wiki/Perceptron
    kind: reference
  notes: >-
    The July 1958 demonstration ran in software on an IBM 704. The Mark I hardware existed by the February
    1960 operators' manual, and Wikipedia says a first version was running in 1958, so don't claim a precise
    build date. Press coverage was famously overblown: the New York Times reported the Navy expected it
    to "walk, talk, see, write". Minsky and Papert's 1969 "Perceptrons" helped cool interest in the field.
    The original Mark I is in the Smithsonian National Museum of American History. Image suggestion: a
    Commons photo of the Mark I Perceptron (not verified; check the license, since some photos are Cornell
    or Smithsonian copyright).

- id: samuel-checkers-nealey
  date: '1962'
  title: Samuel's self-taught checkers program beats Robert Nealey
  category: games
  field: Checkers
  system: Samuel Checkers (Arthur L. Samuel, IBM)
  opponent: Robert Nealey, self-described checkers master
  summary: >-
    Arthur Samuel's IBM checkers program improved partly by playing thousands of games against itself
    and learning from positions it had seen. In 1962 it won a single game against Robert Nealey, whom
    IBM billed as a former Connecticut champion and one of the nation's top players. Samuel's 1959 IBM
    Journal paper described the learning methods behind it.
  significance: >-
    It was the first widely publicized win by a machine-learning program over a strong human player, which
    made "a computer that learns" a public idea.
  image: null
  sources:
  - title: The games that helped AI evolve
    publisher: IBM History
    url: https://www.ibm.com/history/early-games
    kind: primary
  - title: Some Studies in Machine Learning Using the Game of Checkers (IBM J. Res. Dev. 3(3), 1959)
    publisher: IBM Journal of Research and Development
    url: https://doi.org/10.1147/rd.33.0210
    kind: paper
  notes: >-
    The result is contested and often overstated, so flag it honestly. Schaeffer, who built Chinook, notes
    that Nealey did not win the Connecticut title until 1966, that the game was level until a Nealey blunder
    at move 16, and that Nealey won a 1963 six-game rematch with 1 win and 5 draws. In 1966 the program
    lost all 8 games against world-class players Walter Hellman and Derek Oldbury. Only the year 1962
    is documented, not a day. The IEEE Computer Society pioneer page ties the game to the "Computers and
    Thought" anthology (1961-63), which is consistent. Image suggestion: a Commons photo of the IBM 701
    or of Samuel (not verified).

- id: eliza-chatbot
  date: 1966-01
  title: Weizenbaum's ELIZA becomes the first chatbot
  category: language
  field: Conversational agents
  system: ELIZA (Joseph Weizenbaum, MIT)
  summary: >-
    Joseph Weizenbaum at MIT wrote ELIZA in MAD-SLIP for the CTSS time-sharing system on an IBM 7094.
    It matched keywords in typed input and reassembled them into replies according to a script. Its best-known
    script, DOCTOR, imitated a Rogerian psychotherapist by reflecting the user's words back as questions.
    Weizenbaum described it in Communications of the ACM in January 1966.
  significance: >-
    The first program people could hold a free-form text conversation with. Its users readily credited
    it with understanding, which gave its name to the "ELIZA effect".
  image:
    file: ELIZA conversation.png
    alt: A conversation with a 2005 web re-implementation of ELIZA
  sources:
  - title: >-
      ELIZA—a computer program for the study of natural language communication between man and machine
      (CACM 9(1):36-45)
    publisher: Communications of the ACM
    url: https://doi.org/10.1145/365153.365168
    kind: paper
  - title: 'ELIZA Reanimated: The world''s first chatbot restored on the world''s first time sharing system'
    publisher: arXiv (Lane, Hay, Schwarz, Berry, Shrager, 2025)
    url: https://arxiv.org/abs/2501.06707
    kind: paper
  - title: ELIZA
    publisher: Wikipedia
    url: https://en.wikipedia.org/wiki/ELIZA
    kind: reference
  notes: >-
    Weizenbaum intended ELIZA to show how shallow such "understanding" was, and he became a prominent
    critic of AI. The original MAD-SLIP source was found in his MIT archives in 2021 and ran again on
    an emulated CTSS on 21 December 2024. Image suggestion: a Commons screenshot of an ELIZA conversation;
    software screenshots need an explicit free license (not verified).

- id: shrdlu-blocks-world
  date: 1971-02
  title: SHRDLU converses in English about a simulated blocks world
  category: language
  field: Natural language understanding
  system: SHRDLU (Terry Winograd, MIT AI Laboratory)
  summary: >-
    Terry Winograd built SHRDLU at the MIT AI Lab between 1968 and 1970, running on a PDP-6 with a graphics
    display of a small world of blocks, pyramids and a box. Users typed English commands and questions.
    The program moved objects, answered questions about the scene and its own actions, said when it didn't
    know a word, and could learn new terms such as "steeple" from a definition. It was published as MIT
    AI Technical Report 235 and in 1972 as the book "Understanding Natural Language".
  significance: >-
    It was the most convincing language-understanding demonstration of its era, tying parsing, meaning
    and action together, though only inside a tiny closed world.
  image: null
  sources:
  - title: >-
      Procedures as a Representation for Data in a Computer Program for Understanding Natural Language
      (MIT AI TR-235)
    publisher: MIT DSpace
    url: https://dspace.mit.edu/handle/1721.1/7095
    kind: primary
  - title: SHRDLU
    publisher: Wikipedia
    url: https://en.wikipedia.org/wiki/SHRDLU
    kind: reference
  notes: >-
    I added this one. The date is uncertain: Winograd's page gives TR-235 as February 1971, while Wikipedia
    dates the thesis report 1970-08-24, so "1970" would also work. The approach did not scale beyond microworlds.
    Image suggestion: a Commons diagram or recreation of the SHRDLU blocks world (not verified).

- id: shakey-the-robot
  date: '1972'
  title: SRI's Shakey becomes the first mobile robot to reason about its actions
  category: robotics
  field: Mobile robotics / planning
  system: >-
    Shakey (SRI Artificial Intelligence Center: Charles Rosen, Nils Nilsson, Peter Hart, Bertram Raphael
    et al.)
  summary: >-
    From 1966 to 1972, SRI's Artificial Intelligence Center built Shakey, a wheeled robot with a TV camera
    and touch sensors, with funding from DARPA. A large remote computer handled its processing over a
    radio link. Given typed English commands, it could perceive its rooms, plan a route around obstacles
    and push blocks into place. The project produced the A* search algorithm (1968), a practical Hough
    transform for line detection (1972) and the STRIPS planner.
  significance: >-
    It was the first robot to combine perception, planning and action in one physical system, and its
    algorithms are still used in navigation, games and vision today.
  image:
    file: SRI Shakey with callouts.jpg
    alt: Shakey the robot, with its parts labelled
  sources:
  - title: Shakey the Robot
    publisher: SRI International
    url: https://sri.com/hoi/shakey-the-robot
    kind: primary
  - title: 'Shakey (Revolution: Artificial Intelligence & Robotics)'
    publisher: Computer History Museum
    url: https://www.computerhistory.org/revolution/artificial-intelligence-robotics/13/289
    kind: reference
  - title: 'Milestones:SHAKEY: The World''s First Mobile Intelligent Robot, 1972'
    publisher: IEEE / Engineering and Technology History Wiki
    url: https://ethw.org/Milestones:SHAKEY:_The_World’s_First_Mobile_Intelligent_Robot,_1972
    kind: reference
  - title: Shakey the robot
    publisher: Wikipedia
    url: https://en.wikipedia.org/wiki/Shakey_the_robot
    kind: reference
  notes: >-
    This was a multi-year project (1966-1972). The 1972 date follows the IEEE Milestone, which was dedicated
    on 16 February 2017. Life magazine called Shakey the "first electronic person" in 1970. The robot
    is on display at the Computer History Museum (object X279.83). Image suggestion: "SRI Shakey with
    callouts.jpg" is believed to be on Commons but could not be verified, or use a free photo of Shakey
    in its CHM display case.

- id: stanford-cart-chair-room
  date: '1979'
  title: Stanford Cart crosses a chair-filled room on its own
  category: robotics
  field: Robot navigation / stereo vision
  system: Stanford Cart (Hans Moravec, Stanford Artificial Intelligence Laboratory)
  summary: >-
    The Stanford Cart began in the early 1960s as a remote-driving testbed and was later taken over by
    the Stanford AI Lab. Hans Moravec rebuilt it in 1977 and added stereo vision: a camera sliding on
    a rail took pictures from several angles, from which a computer estimated the distance to obstacles
    and planned a path around them. In 1979 the cart crossed a chair-filled room without human help, moving
    in short hops with long pauses to process images and replan.
  significance: >-
    It was an early demonstration of a robot navigating unknown clutter using only computer vision, and
    it formed the basis of Moravec's 1980 PhD thesis.
  image: null
  sources:
  - title: 'Stanford Cart (The Computer Museum slide series: Robots)'
    publisher: Computer History Museum
    url: https://www.computerhistory.org/collections/catalog/102723520
    kind: reference
  - title: Hans Moravec
    publisher: Wikipedia
    url: https://en.wikipedia.org/wiki/Hans_Moravec
    kind: reference
  notes: >-
    The Les Earnest SAIL history page cited originally (with the often-quoted ~5 hour crossing time) is
    gone; the CHM record confirms the 1979 chair-room crossing but not the duration, so the duration was
    dropped.

- id: mycin-meningitis-evaluation
  date: '1979'
  title: MYCIN out-prescribes Stanford experts in a blinded meningitis test
  category: science
  field: Medical diagnosis (expert systems)
  system: MYCIN (Edward Shortliffe, Bruce Buchanan, Stanley Cohen et al., Stanford University)
  opponent: >-
    Five Stanford faculty, an infectious-disease fellow, a resident and a medical student (plus the actual
    therapy given)
  summary: >-
    MYCIN, built at Stanford in the 1970s by Edward Shortliffe with Bruce Buchanan and Stanley Cohen,
    chose antibiotics for serious infections using about 600 if-then rules and backward-chaining inference.
    In a study published in JAMA in 1979, it prescribed for 10 difficult meningitis cases alongside five
    Stanford faculty, an infectious-disease fellow, a resident and a student. Eight outside infectious-disease
    specialists graded every prescription without knowing its source, and rated 65% of MYCIN's acceptable,
    against 42.5-62.5% for the faculty.
  significance: >-
    In a landmark blinded comparison, a rule-based program performed as well as or better than medical
    specialists, the high point of the expert-system approach that DENDRAL had started in the 1960s.
  image: null
  sources:
  - title: >-
      An Evaluation of MYCIN's Advice (Ch. 31 of Buchanan & Shortliffe, Rule-Based Expert Systems, 1984;
      edited from JAMA 242:1279-1282, 1979)
    publisher: Columbia DBMI (book chapter hosted by E. H. Shortliffe)
    url: https://people.dbmi.columbia.edu/~ehs7001/Buchanan-Shortliffe-1984/Chapter-31.pdf
    kind: paper
  - title: Yu et al., MYCIN meningitis therapy evaluation, JAMA 242:1279-1282 (1979)
    publisher: JAMA
    url: https://doi.org/10.1001/jama.1979.03300120033020
    kind: paper
  - title: Mycin
    publisher: Wikipedia
    url: https://en.wikipedia.org/wiki/Mycin
    kind: reference
  - title: Dendral
    publisher: Wikipedia
    url: https://en.wikipedia.org/wiki/Dendral
    kind: reference
  notes: >-
    I picked MYCIN over DENDRAL because of the human-vs-machine evaluation. DENDRAL, at Stanford from
    1964-65 with Feigenbaum, Lederberg, Buchanan and Djerassi, inferred molecular structure from mass
    spectra and is usually called the first expert system; mention it in the UI if useful. The JAMA DOI
    comes from Wikipedia's reference list, but the page itself could not be fetched (the DOI link failed
    and PubMed returned a captcha). Confirm the exact article title and issue date there; volume and pages
    come from the book chapter's footnote. Caveats: only 10 cases, the test covered therapy selection
    only, and MYCIN was never used clinically because of liability and integration problems. Image suggestion:
    none obvious on Commons. A free photo of Shortliffe or a DEC PDP-10 would work (not verified).

- id: bkg-backgammon-villa
  date: 1979-07
  title: BKG 9.8 beats backgammon world champion Luigi Villa 7-1
  category: games
  field: Backgammon
  system: BKG 9.8 (Hans Berliner, Carnegie Mellon University)
  opponent: Luigi Villa, newly crowned backgammon world champion
  summary: >-
    In July 1979 in Monte Carlo, the day after Luigi Villa won the backgammon world championship, Hans
    Berliner's program BKG 9.8 played him a $5,000 winner-take-all match to 7 points and won 7-1. The
    program evaluated positions with smoothly varying weighted features instead of rigid rules. Berliner
    later admitted that it had the better of the dice and that Villa played better.
  significance: >-
    Its creator described it as the first time a computer program beat a reigning world champion at any
    board or card game.
  image:
    file: Backgammon lg.jpg
    alt: A backgammon board
  sources:
  - title: Computer Backgammon (Scientific American 242(6), June 1980, pp. 64-72; reproduced)
    publisher: Hans Berliner / bkgm.com
    url: https://bkgm.com/articles/Berliner/ComputerBackgammon/
    kind: primary
  - title: BKG 9.8 (Hans Berliner)
    publisher: Wikipedia
    url: https://en.wikipedia.org/wiki/BKG_9.8
    kind: reference
  - title: Luigi Villa
    publisher: Wikipedia
    url: https://en.wikipedia.org/wiki/Luigi_Villa
    kind: reference
  notes: >-
    This was a short exhibition match with heavy dice luck: Berliner found the program made the best move
    in only 8 of 73 non-forced positions. Present it as a symbolic threshold, not proof of superior skill.
    The exact day in July 1979 was not confirmed. The Wikipedia BKG_9.8 URL redirects to the Hans Berliner
    article. Image suggestion: a free backgammon-board photo or a Hans Berliner portrait on Commons (not
    verified).

- id: backpropagation-nature-1986
  date: 1986-10
  title: Rumelhart, Hinton and Williams popularize backpropagation
  category: foundations
  field: Neural networks
  system: Backpropagation (David Rumelhart, Geoffrey Hinton, Ronald Williams)
  summary: >-
    In "Learning representations by back-propagating errors" (Nature 323:533-536, 1986), David Rumelhart,
    Geoffrey Hinton and Ronald Williams showed that passing error gradients backward through a multilayer
    network lets its hidden units learn useful internal features on their own. Their experiments got past
    the single-layer limits that had stalled perceptron research.
  significance: >-
    It made gradient-trained multilayer networks practical and popular, and it underlies essentially all
    of modern deep learning.
  image:
    file: Geoffrey Hinton at UBC.jpg
    alt: Geoffrey Hinton
  sources:
  - title: Learning representations by back-propagating errors (Nature 323(6088):533-536)
    publisher: Nature
    url: https://doi.org/10.1038/323533a0
    kind: paper
  - title: Backpropagation
    publisher: Wikipedia
    url: https://en.wikipedia.org/wiki/Backpropagation
    kind: reference
  notes: >-
    Credit the paper for popularizing backpropagation, not inventing it. Reverse-mode automatic differentiation
    goes back to Linnainmaa (1970); Werbos applied it to neural networks (thesis work in the 1970s, a
    standard MLP application in 1982); Parker (1985) and LeCun also described it. The issue is dated 9
    October 1986 to my knowledge, but the page could not be opened, so only the month is given. Hinton
    shared the 2018 Turing Award and the 2024 Nobel Prize in Physics. Image suggestion: a free Commons
    portrait of Geoffrey Hinton or a backprop diagram (not verified).

- id: deep-thought-beats-grandmaster
  date: '1988'
  title: Deep Thought becomes first computer to beat a grandmaster in a tournament game
  category: games
  field: Chess
  system: >-
    Deep Thought (Feng-hsiung Hsu, Thomas Anantharaman, Murray Campbell, Andreas Nowatzyk, Mike Browne;
    Carnegie Mellon University)
  opponent: Bent Larsen, chess grandmaster and former world-championship candidate
  summary: >-
    At the 1988 Software Toolworks Championship in Los Angeles, Carnegie Mellon's Deep Thought defeated
    grandmaster Bent Larsen, a former world-title contender, in a regular tournament game. It tied for
    first with GM Tony Miles at 6.5/8. The result lifted its USCF rating to 2551 and qualified it for
    the $10,000 Fredkin Intermediate Prize, the first 2500-level performance by a computer over 25 straight
    games against humans.
  significance: >-
    It was the first time a machine beat a grandmaster under normal tournament conditions, and the team
    went on to IBM to build Deep Blue.
  image: null
  sources:
  - title: Deep Thought Wins Fredkin Intermediate Prize (AI Magazine 10(2), Summer 1989)
    publisher: Hans Berliner / AAAI AI Magazine
    url: https://ojs.aaai.org/aimagazine/index.php/aimagazine/article/download/753/671/0
    kind: paper
  - title: Deep Thought (chess computer)
