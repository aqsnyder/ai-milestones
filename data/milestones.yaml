    kind: news
  - title: What OpenAI's latest controversy tells us about the future of math
    publisher: MIT Technology Review
    url: >-
      https://www.technologyreview.com/2026/09/08/1143747/what-openais-latest-controversy-tells-us-about-the-future-of-math/
    kind: news
  - title: >-
      Navier–Stokes lost in translation: Why Lean verification of AI autoformalisation does not guarantee
      correct natural language proofs
    publisher: arXiv (Bastounis, Circelli, Hansen)
    url: https://arxiv.org/html/2610.08144v1
    kind: paper
  - title: Navier–Stokes priority controversy
    publisher: Wikipedia
    url: https://en.wikipedia.org/wiki/Navier%E2%80%93Stokes_priority_controversy
    kind: reference
  notes: >-
    UNVERIFIED AND CONTESTED. No peer review yet; the Clay Mathematics Institute said the problem had
    "apparently been settled" but will be "deliberately unhurried" and still lists it as active. Charles
    Fefferman (author of the official problem statement) said he was thrilled. An independent build (Zenodo,
    10 Oct) found no sorry/extra axioms and theorem statements matching DeepMind's Formal Conjectures
    formalization of Fefferman's statement, but arXiv 2610.08144 shows the Lean code is not a faithful
    translation of the written proof (it proves a weaker lemma by a different route). Terence Tao told
    the NYT (16 Oct) that no expert he had talked to had understood the whole argument. Bitter priority/data-use
    dispute: Buckmaster and Alpöge suggest OpenAI may have drawn on their work or Codex data; OpenAI denies
    it. The method builds on Córdoba and Martínez-Zoroa's 2023 approach. The unforced case remains open.
    No OpenAI primary announcement URL was found in searches; add one if available. On 6-7 Oct OpenAI
    also released 700+ manuscripts (~370 result families) claimed by the same line of models, three withdrawn
    for errors; not included as a separate entry. Image suggestion: a free fluid-turbulence or vortex
    image on Commons (not verified).

- id: ataraxos-stratego-superhuman
  date: '2026-09-30'
  title: Ataraxos AI beats Stratego's greatest player, 15 wins to 1
  category: games
  field: Stratego
  system: Ataraxos (Carnegie Mellon, MIT, NYU, Stanford)
  opponent: Pim Niemeijer, four-time Stratego world champion
  summary: >-
    Ataraxos, built by Samuel Sokota, Gabriele Farina and colleagues at Carnegie Mellon, MIT, NYU and
    Stanford, played a 20-game online series against Pim Niemeijer, the most decorated Stratego player
    in history, winning 15, losing 1 and drawing 4. The system combines self-play reinforcement learning
    with test-time search over hidden information and was trained in about a week on 16 H100 GPUs, under
    USD 8,000, a tiny fraction of the compute of DeepMind's earlier DeepNash. The work was published in
    Nature on 30 September 2026.
  significance: >-
    The first superhuman result in Stratego, a long-horizon game of hidden information that had been one
    of the last classic board games where top humans still beat AI.
