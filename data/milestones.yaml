- id: openai-unit-distance-disproof
  date: '2026-05-20'
  title: OpenAI model disproves Erdős's 80-year-old unit distance conjecture
  category: math
  field: Discrete geometry
  system: Unnamed internal general-purpose reasoning model (OpenAI)
  summary: >-
    OpenAI announced that an unreleased general-purpose reasoning model had refuted Erdős's 1946 conjecture
    that n points in the plane can have only slightly more than linearly many pairs at distance exactly
    one. Using ideas from algebraic number theory, it built point sets from a higher-dimensional lattice
    projected into the plane that achieve at least n^(1+δ) unit distances for a fixed δ > 0. Nine outside
    mathematicians, including Noga Alon, Tim Gowers and Melanie Matchett Wood, checked the argument and
    wrote a companion paper, and Will Sawin quickly made the exponent explicit (δ = 0.014, later improved).
  significance: >-
    Experts called it the first AI-generated proof to come close to top-journal standard, and the first
    time AI autonomously settled a famous, long-studied conjecture rather than an obscure one.
  image:
    file: Moser spindle.svg
    alt: The Moser spindle, a unit distance graph
  sources:
  - title: An OpenAI model has disproved a central conjecture in discrete geometry
    publisher: OpenAI
    url: https://openai.com/index/model-disproves-discrete-geometry-conjecture/
    kind: primary
  - title: Remarks on the disproof of the unit distance conjecture
    publisher: OpenAI (Alon, Bloom, Gowers, Litt, Sawin, Shankar, Tsimerman, Wang, Wood)
    url: https://cdn.openai.com/pdf/74c24085-19b0-4534-9c90-465b8e29ad73/unit-distance-remarks.pdf
    kind: paper
  - title: AI just solved an 80-year-old 'Erdős problem,' and mathematicians are amazed
    publisher: Scientific American
    url: >-
      https://www.scientificamerican.com/article/ai-just-solved-an-80-year-old-erdos-problem-and-mathematicians-are-amazed/
    kind: news
  - title: 'Amazing: Erdős'' Unit Distance Problem was Disproved! It was achieved by AI!'
    publisher: Combinatorics and more (Gil Kalai's blog)
    url: >-
      https://gilkalai.wordpress.com/2026/05/21/amazing-erdos-unit-distance-problem-was-disproved-it-was-achieved-by-ai/
    kind: primary
  - title: Why the Legendary Erdős Problems Are Falling to AI
    publisher: Quanta Magazine
    url: https://www.quantamagazine.org/why-the-legendary-erdos-problems-are-falling-to-ai-20260803/
    kind: news
  notes: >-
    This is Erdős problem #90 (USD 500 prize). Caveats: outside experts saw an edited version of the model's
    reasoning, humans cleaned up and extended the proof, the model reportedly succeeded only about half
    the time at maximum budget, and commentators note the tools were known ones combined cleverly rather
    than a fundamentally new idea. The question is not fully resolved (best upper bound remains about
    n^(4/3)). Kalai notes Anthropic also reported an autonomous disproof, without public details. Image
    suggestion: a free unit-distance-graph diagram (e.g. Moser spindle) or Erdős portrait on Commons (not
    verified).

