- id: boolean-pythagorean-triples
  date: '2016-05-03'
  title: SAT solver settles the Boolean Pythagorean triples problem with a 200 TB proof
  category: math
  field: Ramsey theory / automated reasoning
  system: Cube-and-conquer SAT solving (Heule, Kullmann, Marek; UT Austin and Swansea)
  summary: >-
    Marijn Heule, Oliver Kullmann and Victor Marek used a SAT solver to answer a decades-old question
    of Ronald Graham's. The integers 1 to 7,824 can be split into two colors without any single-colored
    Pythagorean triple (a² + b² = c²), but 1 to 7,825 cannot. Their "cube-and-conquer" method ran for
    about two days on an 800-core cluster (the Stampede supercomputer). It produced a machine-checkable
    proof of almost 200 terabytes, which they compressed into a 68 GB certificate.
  significance: >-
    At the time it was the largest mathematical proof ever produced, and it showed automated reasoning
    settling an open problem that human mathematicians had not cracked.
  image: null
  sources:
  - title: Solving and Verifying the boolean Pythagorean Triples problem via Cube-and-Conquer
    publisher: arXiv (SAT 2016)
    url: https://arxiv.org/abs/1605.00723
    kind: paper
  - title: Boolean Pythagorean triples problem
    publisher: Wikipedia
    url: https://en.wikipedia.org/wiki/Boolean_Pythagorean_triples_problem
    kind: reference
  - title: Two-hundred-terabyte maths proof is largest ever
    publisher: Nature News
    url: https://doi.org/10.1038/nature.2016.19990
    kind: news
  notes: >-
    BORDERLINE for an "AI" timeline. This is classic symbolic automated reasoning (SAT solving), not machine
    learning, and it is a brute-force computer-assisted proof like the Four Color Theorem. Keep it only
    if the timeline covers automated theorem proving, such as the Robbins conjecture in 1996. Graham's
    $100 prize went to Heule. The affiliations (UT Austin and Swansea) are from memory; the Wikipedia
    page fetched lists the authors but not where they worked. The Nature News DOI was in Wikipedia's references,
    but nature.com would not load. IMAGE: none found.

- id: microsoft-speech-human-parity
  date: '2016-10-18'
  title: Microsoft claims human parity in conversational speech recognition
  category: perception
  field: Speech recognition
  system: Microsoft conversational speech recognition system (Microsoft AI and Research)
  summary: >-
    A Microsoft Artificial Intelligence and Research team (Wayne Xiong, Jasha Droppo, Xuedong Huang, Frank
    Seide, Mike Seltzer, Andreas Stolcke, Dong Yu, Geoffrey Zweig) reported a 5.9% word error rate on
    the Switchboard portion of the NIST 2000 telephone-conversation benchmark. That matched the 5.9% they
    measured for professional transcribers. The system combined several convolutional and LSTM acoustic
    models with recurrent neural-network language models. The current arXiv abstract gives 5.8% on Switchboard
    and 11.0% on CallHome, against 5.9% and 11.3% for humans.
  significance: >-
    The first claim that a machine matched professional human transcribers on a standard benchmark of
    spontaneous conversational speech.
