- id: alphazero-chess-shogi-go
  date: '2017-12-05'
  title: AlphaZero teaches itself chess, shogi and Go and beats the top programs
  category: games
  field: Chess, shogi and Go
  system: AlphaZero (Google DeepMind)
  summary: >-
    DeepMind's AlphaZero generalized the AlphaGo Zero method: one algorithm, given only the rules, learned
    chess, shogi and Go through self-play. The December 2017 preprint reports it surpassed Stockfish in
    chess after about four hours of training and beat Stockfish 8 by 28 wins, 72 draws and no losses over
    100 games. It also beat the shogi champion program Elmo (90 wins, 8 losses, 2 draws) and a 3-day AlphaGo
    Zero (60-40). A peer-reviewed version in Science (7 December 2018) reported a 1,000-game chess match
    against Stockfish at long time controls that ended with 155 wins, 6 losses and 839 draws.
  significance: >-
    A single general-purpose self-learning algorithm became the strongest player of three different classic
    games, beating decades of hand-tuned engines.
  image: null
  sources:
  - title: Mastering Chess and Shogi by Self-Play with a General Reinforcement Learning Algorithm
    publisher: arXiv (Silver et al.)
    url: https://arxiv.org/abs/1712.01815v1
    kind: paper
  - title: >-
      A general reinforcement learning algorithm that masters chess, shogi, and Go through self-play (Science
      362(6419):1140-1144)
    publisher: Science (record via UCL Discovery)
    url: https://discovery.ucl.ac.uk/id/eprint/10069050/
    kind: paper
  - title: AlphaZero
    publisher: Wikipedia
    url: https://en.wikipedia.org/wiki/AlphaZero
    kind: reference
  notes: >-
    Contested setup. Critics, including Stockfish co-author Tord Romstad and Hikaru Nakamura, objected
    that the 2017 match gave Stockfish a fixed 1 minute per move, an undersized 1 GB hash for 64 threads
    and much weaker hardware than AlphaZero's TPUs. The 2018 Science paper reran under fairer conditions
    (3 hours plus 15 seconds per move). Science DOI 10.1126/science.aar6404. Training used 5,000 first-generation
    TPUs for self-play and 64 second-generation TPUs for network training. There is no DeepMind blog URL
    here because the search budget ran out; add "AlphaZero: Shedding new light on chess, shogi, and Go"
    (December 2018) if found. IMAGE: none confirmed. A chess or shogi board photo from Commons would suit.

- id: bert-pretrained-transformers
  date: '2018-10-11'
  title: Google's BERT makes pretrain-then-fine-tune the standard recipe for NLP
  category: language
  field: Natural language understanding
  system: BERT (Google AI Language)
  summary: >-
    Google AI researchers (Devlin, Chang, Lee and Toutanova) released BERT, a Transformer pretrained on
    unlabeled text by predicting masked-out words using context on both sides, then fine-tuned for individual
    tasks. It set new records on 11 benchmarks, including a GLUE score of 80.5 (+7.7 points) and 93.2
    F1 on the SQuAD v1.1 reading-comprehension test. Google began using BERT in Search for US English
    queries in October 2019.
  significance: >-
    BERT showed that a single large pretrained language model could be adapted to almost any language
    task, which set off the pretrained-model era that led to GPT-3 and ChatGPT.
  image: null
  sources:
  - title: 'BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding'
