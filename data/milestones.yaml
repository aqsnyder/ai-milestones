- id: hinton-deep-belief-nets
  date: 2006-07
  title: Hinton's deep belief nets show deep networks can be trained layer by layer
  category: foundations
  field: Deep learning
  system: Deep belief network (Geoffrey Hinton, Simon Osindero, Yee-Whye Teh; University of Toronto /
    NUS)
  summary: >-
    In "A fast learning algorithm for deep belief nets" (Neural Computation 18(7):1527-1554, July 2006),
    Geoffrey Hinton, Simon Osindero and Yee-Whye Teh showed how to train a deep, many-layered generative
    network one layer at a time with an unsupervised greedy procedure. The resulting network could then
    be fine-tuned, including for classification. At the time most researchers had given up on training
    networks with many hidden layers.
  significance: >-
    It is widely credited with reviving interest in deep neural networks and with the rise of the term
    "deep learning", which led to the GPU-era breakthroughs from 2009 onward.
  image: null
  sources:
  - title: A fast learning algorithm for deep belief nets (Neural Computation 18(7):1527-1554)
    publisher: MIT Press / Neural Computation (DOI)
    url: https://doi.org/10.1162/neco.2006.18.7.1527
    kind: paper
  - title: Deep belief network
    publisher: Wikipedia
    url: https://en.wikipedia.org/wiki/Deep_belief_network
    kind: reference
  notes: >-
    Optional foundational entry. Its importance is a retrospective judgment, and later deep learning mostly
    dropped layer-wise pretraining, so the maintainer may cut it to keep the foundations list short. The
    DOI and PubMed pages could not be read here (rate-limited or empty response); the citation details
    come from Wikipedia. The affiliation in "system" (Toronto / NUS) is from general knowledge and was
    not checked. Image candidate (unverified on Commons): "Geoffrey Hinton at UBC.jpg" (Hinton lecturing
    on deep neural networks in 2013, by Eviatar Bach, CC BY-SA 3.0).

- id: checkers-solved
  date: '2007-07-19'
  title: 'Checkers is solved: perfect play by both sides ends in a draw'
  category: games
  field: Checkers
  system: Chinook project (Jonathan Schaeffer and colleagues, University of Alberta)
  summary: >-
    Jonathan Schaeffer's University of Alberta team reported in Science that 8x8 checkers is weakly solved:
    from the standard opening, neither side can force a win if both play perfectly. The proof combined
    endgame databases covering 39 trillion positions with 10 or fewer pieces with a best-first forward
    search from the opening. About 10^14 of the game's roughly 5x10^20 positions were evaluated, in computations
    that started in 1989.
  significance: >-
    Checkers became the most complex popular game ever solved. The result closed the story of Chinook,
    whose engine and databases were the foundation of the proof.
  image:
    file: Jonathan Schaeffer.jpg
    alt: Jonathan Schaeffer, who led the Chinook project
  sources:
  - title: Checkers Is Solved (Science 317(5844):1518-1522)
    publisher: Science (AAAS), DOI
    url: https://doi.org/10.1126/science.1144079
    kind: paper
  - title: 'Chinook - World Man-Machine Checkers Champion ("Perfect Play: Draw!")'
    publisher: University of Alberta
    url: https://webdocs.cs.ualberta.ca/~chinook/
    kind: primary
  - title: Checkers Solved
    publisher: IEEE Spectrum
    url: https://spectrum.ieee.org/amp/checkers-solved-2650250505
    kind: news
  - title: Solved game
    publisher: Wikipedia
    url: https://en.wikipedia.org/wiki/Solved_game
    kind: reference
  notes: >-
    The date is Science's online publication date, 19 July 2007. Wikipedia dates completion of the computation
    to 29 April 2007. "Weakly solved" means the game value from the start position is proven, not every
    position. The DOI page could not be opened here, so the citation details come from Wikipedia and IEEE
    Spectrum. Image candidates (unverified on Commons): "Jonathan Schaeffer.jpg" (Schaeffer in 2014, by
    Scott Mair via Flickr, CC BY 2.0) or "CheckersStandard.jpg" (GFDL 1.2+ / CC BY 3.0, Jud McCranie).

- id: boss-darpa-urban-challenge
  date: '2007-11-03'
  title: CMU's Boss wins the DARPA Urban Challenge in city-style traffic
  category: robotics
  field: Autonomous driving
  system: 'Boss (Tartan Racing: Carnegie Mellon University with General Motors, led by William "Red" Whittaker)'
  summary: >-
    On 3 November 2007, 11 robot vehicles ran DARPA's Urban Challenge on a mock urban road network at
    the former George Air Force Base in Victorville, California. Each had to complete about 55 miles (89
    km) of missions among other vehicles. Six finished. Boss, a robotized 2007 Chevy Tahoe from Carnegie
    Mellon and General Motors' Tartan Racing team led by William "Red" Whittaker, averaged about 14 mph
    and finished about 20 minutes ahead of Stanford's Junior. It won the $2 million first prize. Junior
    took second ($1 million) and Virginia Tech's Odin third ($500,000).
  significance: >-
    Driverless cars had shown they could handle intersections, merging and other traffic, not just empty
    desert. Many of the people involved went on to lead industry self-driving programs.
