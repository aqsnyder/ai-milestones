- id: alphaevolve-matrix-multiplication
  date: '2025-05-14'
  title: AlphaEvolve beats Strassen for 4x4 complex matrices, advances open problems
  category: math
  field: Algorithms and combinatorics
  system: AlphaEvolve (Google DeepMind), powered by Gemini
  summary: >-
    Google DeepMind's AlphaEvolve is an evolutionary coding agent: Gemini models propose code changes
    and automated evaluators score them. It found a way to multiply two 4x4 complex-valued matrices with
    48 scalar multiplications, the first improvement in that setting over the 49 from applying Strassen's
    1969 algorithm recursively. On more than 50 open problems in analysis, geometry, combinatorics and
    number theory, it matched the best known results in about 75% of cases and improved them in about
    20%. One example is a new lower bound of 593 for the kissing number in 11 dimensions. Inside Google,
    it found a data-center scheduling heuristic that recovers about 0.7% of fleet-wide compute.
  significance: >-
    An LLM-driven discovery system improved results that had stood for decades, including a 56-year-old
    benchmark in fast matrix multiplication.
