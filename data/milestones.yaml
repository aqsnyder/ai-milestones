  title: Agent57 beats the human benchmark on all 57 Atari games
  category: games
  field: Atari 2600
  system: Agent57 (DeepMind)
  summary: >-
    DeepMind's Agent57 became the first deep reinforcement learning agent to score above the standard
    human baseline on every game in the 57-game Atari benchmark. That included Montezuma's Revenge, Pitfall,
    Solaris and Skiing, which had defeated earlier agents. It combines a curiosity-driven exploration
    method with a meta-controller that decides how much to explore versus exploit.
  significance: >-
    This closed out the Atari benchmark that DQN made famous in 2013-2015, with superhuman scores on the
    whole suite, including the hardest exploration games.
