    kind: paper
  - title: Marion Tinsley
    publisher: Wikipedia
    url: https://en.wikipedia.org/wiki/Marion_Tinsley
    kind: reference
  notes: >-
    Chinook won the title by forfeit, not by beating Tinsley over the board, so present it that way. Tinsley
    was diagnosed with pancreatic cancer shortly afterwards and died on 3 April 1995. The 1994 Lafferty
    match was 20 games (1-1, 18 draws). Wikipedia separately describes a 1995 title defence against Lafferty
    (32 games, 1-0, 31 draws). Image candidates (unverified on Commons): "Marion Tinsley.jpg" (1988, Florida
