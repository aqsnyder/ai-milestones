  - title: Deep Blue versus Garry Kasparov
    publisher: Wikipedia
    url: https://en.wikipedia.org/wiki/Deep_Blue_versus_Garry_Kasparov
    kind: reference
  - title: >-
      IBM Deep Blue Team (Joe Hoane, Joel Benjamin, Jerry Brody, Feng-Hsiung Hsu, C.J. Tan, and Murray
      Campbell)
    publisher: Computer History Museum
    url: https://www.computerhistory.org/chess/stl-431e1a07a3881/
    kind: reference
  notes: >-
    After game 2, Kasparov accused IBM of human intervention. No evidence was found, but the accusation
    is part of the story. The technical paper is Campbell, Hoane and Hsu, "Deep Blue", Artificial Intelligence
    134(1-2):57-83, 2002 (no DOI URL seen). Image candidates (unverified on Commons): "Deep Blue.jpg"
    (one of the two Deep Blue racks at the Computer History Museum, photographed 14 June 2007 by "James
    the photographer" (Jim Gardner) on Flickr, CC BY 2.0); "Kasparov-29.jpg" (Kasparov playing Deep Junior
    in 2003, CC BY-SA 3.0 / GFDL, The Kasparov Agency, VRT-verified); "Garry Kasparov, New York City,
    2003.jpg" (CC BY-SA 3.0 / GFDL).

