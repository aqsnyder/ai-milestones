    url: https://arxiv.org/abs/2503.23674
    kind: paper
  - title: Turing test
    publisher: Wikipedia
    url: https://en.wikipedia.org/wiki/Turing_test
    kind: reference
  notes: >-
    The 73% result depends on a persona prompt, and the conversations were short (five minutes). Critics
    argue such tests measure how easily people are fooled, not intelligence. It was a preprint in 2025,
    and Wikipedia says formal publication followed in 2026. Image suggestion: a public-domain photo of
