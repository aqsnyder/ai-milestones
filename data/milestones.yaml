    url: https://en.wikipedia.org/wiki/ImageNet
    kind: reference
  notes: >-
    Optional foundational entry, and the setup for era 3's alexnet-imagenet-2012. The 14.2M images / 21,841
    synsets figures are from April 2010, not the launch. The size at publication was not checked (the
