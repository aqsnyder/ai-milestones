- id: alphadev-faster-sorting
  date: '2023-06-07'
  title: AlphaDev discovers faster sorting routines merged into LLVM's libc++
  category: math
  field: Algorithms (sorting)
  system: AlphaDev (Google DeepMind)
  summary: >-
    Google DeepMind's AlphaDev treated writing low-level assembly as a single-player game and used reinforcement
    learning (building on AlphaZero) to search for shorter, faster routines for sorting very short sequences.
    The resulting routines were translated into C++ and accepted into LLVM's standard C++ library, libc++.
    DeepMind reported they were up to 70% faster for short sequences and about 1.7% faster for sequences
    over 250,000 elements, and called it the first change to that part of the library in more than a decade.
    AlphaDev also found a hashing routine about 30% faster for 9-16 byte inputs, released in Google's
    Abseil library.
  significance: >-
    An algorithm found by reinforcement learning, rather than written by people, shipped in one of the
    most widely used software libraries in the world.
  image: null
  sources:
  - title: AlphaDev discovers faster sorting algorithms
