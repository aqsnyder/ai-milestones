    that Erdős problems vary hugely in difficulty and estimated only ~1-2% of open ones are within easy
    reach of current AI. A Dec 2025 "AI solution" to problem #333 turned out to be already in the literature.
    Accounts differ on who ran Aristotle (Barreto vs Boris Alexeev). Image suggestion: a free portrait
    of Paul Erdős or Terence Tao on Commons (not verified).

- id: humanoid-robot-half-marathon-record
