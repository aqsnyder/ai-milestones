- id: erdos-problem-124-aristotle
  date: 2025-11
  title: 'Harmonic''s Aristotle autonomously proves a version of Erdős problem #124'
  category: math
  field: Number theory (Erdős problems)
  system: Aristotle (Harmonic), run by Boris Alexeev
  summary: >-
    In late November 2025, mathematician Boris Alexeev ran Harmonic's Aristotle prover in autonomous mode
    on formal statements of open problems from Thomas Bloom's erdosproblems.com database. Aristotle returned
    a Lean-verified proof of problem #124 as Erdős had posed it in two 1997 papers. It was a short proof,
    and the problem had sat on the site as open. The episode came a month after an overclaim: in October,
    OpenAI staff said GPT-5 had "found solutions to 10 previously unsolved Erdős problems," but it had
    actually found existing papers that already solved them. Bloom called the claim "a dramatic misrepresentation."
  significance: >-
    Among the first cases of an AI system independently producing a new, machine-checked solution to a
    problem listed as open on the Erdős database, but on an easier variant rather than a celebrated hard
    problem.
  image:
    file: Erdos budapest fall 1992.jpg
    alt: Paul Erdős in Budapest, 1992
  sources:
  - title: 'Erdős Problem #124'
    publisher: erdosproblems.com (Thomas Bloom)
    url: https://www.erdosproblems.com/124
    kind: primary
  - title: Formalization of Erdős problems (guest post by Boris Alexeev)
    publisher: Xena Project blog (Kevin Buzzard)
    url: https://xenaproject.wordpress.com/2025/12/05/formalization-of-erdos-problems
    kind: primary
  - title: OpenAI's 'embarrassing' math
    publisher: TechCrunch
    url: https://techcrunch.com/2025/10/19/openais-embarrassing-math/
    kind: news
  - title: Why the Legendary Erdős Problems Are Falling to AI
    publisher: Quanta Magazine
    url: https://www.quantamagazine.org/why-the-legendary-erdos-problems-are-falling-to-ai-20260803/
    kind: news
  notes: >-
    Treat this one carefully. (1) Aristotle solved only "a" version of #124: Question 1 on erdosproblems.com.
    Per Terence Tao, a key hypothesis had been dropped in two of Erdős's papers, which made that version
    follow from a known result. The original 1996 Burr-Erdős-Graham-Li conjecture (Question 2) remains
    open, and Bloom called the proof very simple. Alexeev himself says the result carries an asterisk.
    (2) The run was a Friday night, likely 28 November 2025, and the result was publicized around 30 November-1
    December, so only year-month is given. (3) Other late-2025 episodes: in the October GPT-5 claim (Kevin
    Weil's deleted post; Hassabis called it "embarrassing"), literature search was the real contribution.
    In December, Aristotle produced a not-especially-novel Lean proof of a key case of #1026, which Tao
    wrote up as a human-AI collaboration. A Christmas 2025 claim of an autonomous LLM solution to #333
    turned out to be in a 1977 Erdős paper (Quanta). The case often cited as the first genuinely new LLM-led
    solution, #728 with GPT-5.2 Pro and Aristotle, came on 4 January 2026, which is outside this era.
    Image suggestion: a free portrait of Paul Erdős, probably "Erdos budapest fall 1992.jpg" (unverified;
    confirm the exact filename and its CC license).

- id: erdos-728-gpt52-aristotle
  date: 2026-01
  title: 'GPT-5.2 Pro and Aristotle resolve Erdős problem #728 almost autonomously'
  category: math
  field: Number theory
  system: GPT-5.2 Pro (OpenAI) with Aristotle (Harmonic) for Lean formalization
  summary: >-
    In early January 2026 amateur Kevin Barreto prompted OpenAI's GPT-5.2 Pro to attack Erdős problem
    #728, a question about when products of factorials divide other factorials. The model produced an
    argument that was then formalized and machine-checked in Lean using Harmonic's Aristotle system, and
    no prior solution was found in the literature. Terence Tao described the problem as solved "more or
    less autonomously" by AI, and a write-up of the Lean proof was posted to arXiv on 12 January.
  significance: >-
    Widely regarded as the first open Erdős problem resolved essentially autonomously by AI with a formally
    verified proof, kicking off a year in which AI systems resolved dozens of such problems.
