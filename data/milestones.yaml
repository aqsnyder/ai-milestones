- id: stanley-darpa-grand-challenge
  date: '2005-10-08'
  title: Stanford's Stanley wins the DARPA Grand Challenge desert race
  category: robotics
  field: Autonomous driving
  system: Stanley (Stanford Racing Team led by Sebastian Thrun, with Volkswagen Electronics Research Lab)
  summary: >-
    In the 2004 Grand Challenge no robot finished, and the best entry covered only 11.78 km (7.32 mi).
    In the second race on 8 October 2005, Stanley, a driverless Volkswagen Touareg from Sebastian Thrun's
    Stanford Racing Team, completed the 212 km (132 mi) desert course in just under 6 hours 54 minutes.
    Five vehicles finished in total. Stanley used five roof LIDARs, a camera, GPS and inertial sensors,
    and its terrain and obstacle perception relied on machine learning. The team won the $2 million prize.
  significance: >-
    Fully autonomous vehicles completed a long off-road course for the first time, which kicked off the
    modern self-driving car industry.
  image:
    file: Stanley2.JPG
    alt: Stanford's Stanley at the 2005 DARPA Grand Challenge
  sources:
