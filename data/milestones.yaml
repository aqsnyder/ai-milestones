- id: cepheus-limit-holdem-solved
  date: '2015-01-08'
  title: Cepheus essentially solves heads-up limit Texas hold'em poker
  category: games
  field: Poker (heads-up limit hold'em)
  system: Cepheus (Computer Poker Research Group, University of Alberta)
  summary: >-
    Michael Bowling, Neil Burch, Michael Johanson and Oskari Tammelin of the University of Alberta's Computer
    Poker Research Group reported in Science that their program Cepheus plays heads-up limit Texas hold'em
    so close to optimally that the game is "essentially weakly solved". The strategy comes from a new
    algorithm, CFR+, and the best possible counter-strategy would win only about 0.001 big blinds per
    game against it. The computation used roughly 4,000 CPUs for about two months.
  significance: >-
    The first time a poker game that people play competitively, a game with hidden information and bluffing,
    was essentially solved by a computer.
