- id: polaris-limit-holdem-pros
  date: '2008-07-06'
  title: Polaris beats a team of poker pros at heads-up limit Texas hold'em
  category: games
  field: Poker (heads-up limit Texas hold'em)
  system: Polaris (University of Alberta Computer Poker Research Group)
  opponent: Team of limit hold'em pros incl. Matt Hawrilenko, IJay Palansky, Nick Grudzien, Kyle Hendon
  summary: >-
    In the Second Man-Machine Poker Championship, the University of Alberta's Polaris played six duplicate
    matches against online limit hold'em professionals. The first two were played remotely and the last
    four took place at the Gaming Life Expo in Las Vegas from 3 to 6 July 2008. Duplicate scoring dealt
    the same cards to both human-machine pairings with seats reversed, which cuts down on luck. Polaris
    finished with 3 wins, 2 losses and 1 draw, clinching the event on 6 July by winning both sides of
    the final match against Matt Hawrilenko and IJay Palansky. A year earlier, Phil Laak and Ali Eslami
    had narrowly beaten an earlier Polaris in Vancouver.
  significance: >-
    This was the first time a poker program beat top human professionals in a meaningful match, in a game
    with hidden information and bluffing.
  image:
    file: Holdem.jpg
    alt: A Texas hold'em poker game
  sources:
  - title: Second Man-Machine Poker Competition
    publisher: University of Alberta Computer Poker Research Group
    url: https://webdocs.cs.ualberta.ca/~games/poker/man-machine/
    kind: primary
