  summary: >-
    OpenAI released GPT-4 on 14 March 2023 with a technical report saying the model passed a simulated
    Uniform Bar Exam with a score around the top 10% of test takers (a reported scaled score of 298),
    alongside strong results on many other academic and professional exams. The bar exam evaluation was
    run with OpenAI's collaborators Casetext and Stanford CodeX. A 2024 peer-reviewed re-analysis by MIT's
    Eric Martínez concluded the 90th-percentile figure was inflated: it rested on February Illinois data
    skewed toward repeat takers. Against a July exam the estimate fell below the 69th percentile overall,
    to about the 62nd among first-time takers and about the 48th among those who passed, with essays weaker
    still.
  significance: >-
    The moment a general-purpose chatbot was credibly reported to pass a professional licensing exam,
    which made "AI vs. human professionals" a mainstream question, even though the headline percentile
    was later shown to be overstated.
