- id: libratus-no-limit-holdem
  date: '2017-01-30'
  title: Libratus beats top professionals at heads-up no-limit Texas hold'em
  category: games
  field: Poker (heads-up no-limit hold'em)
  system: Libratus (Carnegie Mellon University; Tuomas Sandholm and Noam Brown)
  opponent: Jason Les, Dong Kim, Daniel McAulay and Jimmy Chou, top heads-up no-limit professionals
  summary: >-
    In the 20-day "Brains Vs. Artificial Intelligence: Upping the Ante" event at Rivers Casino in Pittsburgh,
    Carnegie Mellon's Libratus played 120,000 hands of heads-up no-limit Texas hold'em against four specialist
    pros: Jason Les, Dong Kim, Daniel McAulay and Jimmy Chou. Libratus was built by Tuomas Sandholm and
    Ph.D. student Noam Brown and ran on the Pittsburgh Supercomputing Center's Bridges machine. It finished
    $1,766,250 ahead in chips, about 14.7 big blinds per 100 hands, a margin its makers called statistically
    significant. Separately, DeepStack (University of Alberta with Charles University and Czech Technical
    University) beat professionals over 44,000 hands in late 2016, reported in Science in March 2017.
  significance: >-
    The first time an AI decisively beat top human professionals at no-limit hold'em, a hidden-information
    game of bluffing long considered out of reach.
