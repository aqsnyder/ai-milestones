    kind: paper
  - title: AlphaGo
    publisher: Wikipedia
    url: https://en.wikipedia.org/wiki/AlphaGo
    kind: reference
  notes: >-
    DOI 10.1038/nature24270. The DeepMind post and online publication are dated 18 October 2017, and UCL
    Discovery gives the issue date as 19 October 2017. The 100-0 result came from games against itself,
    not against humans. IMAGE: none confirmed. Commons diagrams such as "Lee Sedol (B) vs AlphaGo (W)
    - Game 1.svg" were seen in search results but their pages would not load. A photo of a Go board with
