- id: eqp-robbins-conjecture
  date: '1996-10-10'
  title: Automated prover EQP settles the 60-year-old Robbins conjecture
  category: math
  field: Boolean algebra
  system: EQP equational theorem prover (William McCune, Argonne National Laboratory)
  summary: >-
    In the 1930s Herbert Robbins asked whether commutativity, associativity and a single "Robbins equation"
    are enough to axiomatize Boolean algebra. Edward Huntington, Alfred Tarski and others tried and failed
    to settle it. On 10 October 1996, EQP, an equational theorem prover written by William McCune at Argonne
    National Laboratory, found a proof that the answer is yes. The successful search ran for about 8 days
    on an IBM RS/6000 and used about 30 MB of memory.
  significance: >-
    A computer program, with no human proof sketch to follow, produced the first solution to a well-known
    open problem that leading mathematicians had worked on for decades.
  image:
    file: 1966-HerbertRobbins.jpg
    alt: Mathematician Herbert Robbins
  sources:
  - title: Robbins Algebras Are Boolean
    publisher: William McCune (Argonne National Laboratory), hosted at University of New Mexico
    url: https://www.cs.unm.edu/~mccune/papers/robbins/
    kind: primary
  - title: Solution of the Robbins Problem (Journal of Automated Reasoning 19(3):263-276, 1997)
    publisher: Springer
    url: https://link.springer.com/article/10.1023/A:1005843212881
    kind: paper
  - title: Robbins algebra
    publisher: Wikipedia
    url: https://en.wikipedia.org/wiki/Robbins_algebra
    kind: reference
  - title: Robbins Conjecture
    publisher: Wolfram MathWorld
    url: https://mathworld.wolfram.com/RobbinsConjecture.html
    kind: reference
  notes: >-
    The date is when EQP found the proof. It was posted on the web in October 1996, covered by the New
    York Times (Gina Kolata, "Computer Math Proof Shows Reasoning Power", 10 Dec 1996, as cited by MathWorld;
    no NYT URL was seen, so it is not linked), and published in JAR in Dec 1997. The proof builds on earlier
    reductions by Steve Winker, also at Argonne, and humans then simplified the machine proof. Image candidate:
    "1966-HerbertRobbins.jpg" (the DBpedia depiction for Herbert Robbins; license not checked), or a photo
    of Argonne National Laboratory.

- id: deep-blue-kasparov
  date: '1997-05-11'
  title: IBM's Deep Blue defeats world chess champion Garry Kasparov
  category: games
  field: Chess
  system: >-
    Deep Blue (IBM Research: Feng-hsiung Hsu, Murray Campbell, Joe Hoane, Jerry Brody, C. J. Tan; GM Joel
    Benjamin as adviser)
  opponent: Garry Kasparov, reigning world chess champion
  summary: >-
    In February 1996 in Philadelphia, Deep Blue beat Kasparov in game 1, the first game a computer had
    won against a reigning world champion at classical time controls, but Kasparov took the match 4-2.
    In the May 1997 rematch at New York's Equitable Center, an upgraded Deep Blue lost game 1 and won
    game 2. Games 3-5 were drawn, and Deep Blue won game 6 on 11 May to take the match 3.5-2.5. The IBM
    team was led by Feng-hsiung Hsu and Murray Campbell. Their parallel system used custom chess chips
    and could examine about 200 million positions per second.
  significance: >-
    This was the first time a computer defeated a reigning world chess champion in a match under standard
    tournament conditions, a goal AI researchers had pursued since the 1950s.
  image:
    file: Deep Blue.jpg
    alt: One of Deep Blue's two racks at the Computer History Museum
  sources:
  - title: Deep Blue
    publisher: IBM (IBM History)
    url: https://www.ibm.com/history/deep-blue
