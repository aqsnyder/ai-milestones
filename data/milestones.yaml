- id: funsearch-cap-sets
  date: '2023-12-14'
  title: 'FunSearch: LLM-driven program search finds new, larger cap sets'
  category: math
  field: Combinatorics (cap sets)
  system: FunSearch (Google DeepMind)
  summary: >-
    Google DeepMind's FunSearch pairs a pretrained code-writing language model with an automated evaluator
    in an evolutionary loop. The model proposes small programs, the best are kept, and they are fed back
    as prompts. Applied to the cap set problem, FunSearch found a cap set of size 512 in dimension 8,
    larger than any previously known construction. It also improved lower bounds on the asymptotic cap
    set capacity, and it found online bin-packing heuristics that beat standard ones. The work was published
    in Nature with co-author Jordan Ellenberg.
  significance: >-
    DeepMind described it as the first time a large language model was used to make a new, verifiable
    discovery on a challenging open problem in mathematics.
  image: null
