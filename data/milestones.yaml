- id: openai-astra-ten-open-problems
  date: '2026-08-01'
  title: OpenAI's Astra model claims ten long-open math results, incl. a non-sofic group
  category: math
  field: Group theory / combinatorics / TCS
  status: self-reported
  system: Astra, internal pre-release model (OpenAI); later released as GPT-6 Astra
  summary: >-
    OpenAI announced that an internal version of its next model, Astra, had produced ten new results on
    problems each open for at least a decade, released with a 249-page manuscript and a Lean 4 certificate
    for every proof. The headline item was the first construction of a non-sofic group, settling the question
    of whether all groups are sofic (open since soficity was introduced around 1999). Others included
    a disproof of Connes's rigidity conjecture, Ehrhart's volume conjecture, improved sphere-packing and
    code bounds, and three more Erdős problems (#146, #180, #183). Some mathematicians questioned how
    much the work owed to earlier papers and to their own ChatGPT conversations; as of October 2026 no
    one had publicly challenged the proofs' correctness.
  significance: >-
    The largest batch of machine-checked AI solutions to long-open problems announced at once, headlined
    by the first known non-sofic group.
