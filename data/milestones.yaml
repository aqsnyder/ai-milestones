    In the CASP14 blind assessment, DeepMind's AlphaFold 2 predicted protein 3D structures with a median
    GDT score of 92.4 across all targets, an average error of about 1.6 Å. That is near the level of experimental
    methods, and far ahead of every other entrant. CASP's organizers described it as a solution to the
    50-year-old protein-folding problem. The method was published in Nature in July 2021 along with open-source
    code.
  significance: >-
    AI solved a grand challenge in biology at experimental-grade accuracy, which changed how structural
    biology and drug discovery work and contributed to the 2024 Nobel Prize in Chemistry.
