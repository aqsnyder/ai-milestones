- id: gpt-4-5-turing-test
  date: '2025-03-31'
  title: GPT-4.5 judged human more often than real humans in a Turing test
  category: language
  field: Turing test
  system: GPT-4.5 (OpenAI), tested by Jones and Bergen (UC San Diego)
  opponent: Human witnesses and interrogators in a randomized three-party Turing test
  summary: >-
    UC San Diego researchers Cameron Jones and Benjamin Bergen ran randomized, pre-registered three-party
    Turing tests. Each interrogator chatted for five minutes at once with a real person and an AI, then
    chose which was human. Prompted to adopt a humanlike persona, GPT-4.5 was picked as the human 73%
    of the time, significantly more often than the real humans it was paired with. LLaMa-3.1-405B was
    picked 56% of the time (not significantly different from humans), while the baselines ELIZA and GPT-4o
    were picked 23% and 21%.
  significance: >-
    The authors presented it as the first empirical evidence that an AI system passes a standard three-party
    version of Turing's imitation game.
  image:
    file: Alan Turing (1912-1954) in 1936 at Princeton University.jpg
    alt: Alan Turing at Princeton in 1936
  sources:
