- id: alphatensor-matrix-multiplication
  date: '2022-10-05'
  title: AlphaTensor discovers faster matrix multiplication algorithms
  category: math
  field: Algorithms (matrix multiplication)
  system: AlphaTensor (DeepMind)
  summary: >-
    DeepMind recast the search for matrix multiplication algorithms as a single-player game of decomposing
    a 3D tensor, and trained an AlphaZero-style agent to play it. AlphaTensor found a way to multiply
    4x4 matrices in mod-2 arithmetic with 47 multiplications, beating the 49 from applying Strassen's
    1969 method twice, and cut 4x5-by-5x5 products from 80 to 76 multiplications. It also found hardware-tailored
    algorithms that ran 10-20% faster on Nvidia V100 GPUs and Google TPUs.
  significance: >-
    This was the first improvement on Strassen's two-level algorithm in a finite field in over 50 years,
    and it was found by an AI, showing AI could discover new provably correct algorithms in a fundamental
    area of math.
  image:
    file: Matrix multiplication diagram 2.svg
    alt: Diagram of matrix multiplication
  sources:
  - title: Discovering novel algorithms with AlphaTensor
    publisher: Google DeepMind
    url: https://deepmind.google/discover/blog/discovering-novel-algorithms-with-alphatensor/
    kind: primary
  - title: >-
      Discovering faster matrix multiplication algorithms with reinforcement learning (Fawzi et al., Nature
      610, 47-53)
    publisher: Nature (via PubMed Central)
    url: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC9534758/
    kind: paper
  - title: AlphaTensor
    publisher: Wikipedia
    url: https://en.wikipedia.org/wiki/AlphaTensor
    kind: reference
  notes: >-
    The 47-multiplication result holds only in mod-2 arithmetic, not for ordinary real numbers. Human
    researchers soon improved some of AlphaTensor's other records (e.g. Kauers and Moosbauer, late 2022);
    this is from memory and was not re-verified. "Fawzi et al." as first author is also from memory. Image:
    a free matrix-multiplication diagram on Commons would fit (not checked).

