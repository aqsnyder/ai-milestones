  system: Pluribus (Carnegie Mellon University and Facebook AI)
  opponent: Elite professional poker players, including Chris Ferguson and Darren Elias
  summary: >-
    Noam Brown and Tuomas Sandholm of Carnegie Mellon and Facebook AI built Pluribus, which played 10,000
    hands of six-player no-limit hold'em against elite professionals over 12 days. It won an average of
    48 milli-big-blinds per game in the one-AI, five-human format, and also beat Chris Ferguson and Darren
    Elias, each playing alongside five copies of the bot. Its blueprint strategy cost about 12,400 CPU
    core-hours to compute, on a single 64-core server.
  significance: >-
    This was the first time an AI beat top humans at a multiplayer poker game (more than two players),
