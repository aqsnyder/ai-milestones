  summary: >-
    In the five-game DeepMind Challenge Match at the Four Seasons Hotel in Seoul, held from 9 to 15 March
    2016, AlphaGo beat Lee Sedol 4-1. Lee was a 9-dan professional with 18 world titles. AlphaGo's unconventional
