  system: Lightning humanoid robot (Honor)
  summary: >-
    At the Beijing E-Town Humanoid Robot Half Marathon on 19 April 2026, a bipedal humanoid called Lightning,
    built by smartphone maker Honor, won the 21 km race in 50 minutes 26 seconds. That was roughly seven
    minutes quicker than the men's human world record for the distance, while the winning robot in the
    inaugural 2025 race had needed more than two hours. Robots ran on a course parallel to the human runners,
    and several fell or veered off course. Race rules allowed both autonomous and remote-controlled robots,
    and Honor did not say which mode Lightning used.
