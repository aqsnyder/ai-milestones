name: Suggest a milestone
description: Propose an AI achievement for the timeline
title: "Milestone: "
labels: ["suggestion"]
body:
  - type: input
    id: what
    attributes:
      label: What happened?
      placeholder: "e.g. AlphaGo defeats Lee Sedol 4–1"
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date
      placeholder: "YYYY-MM-DD"
    validations:
      required: true
  - type: dropdown
    id: bar
    attributes:
      label: Which bar does it clear?
      description: See MAINTAINING.md for details.
      options:
        - Humans beaten
        - Open problem solved
        - Human-level threshold crossed
        - Science changed
        - Foundations
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources (at least two, ideally one primary)
      placeholder: |
        - https://...
        - https://...
    validations:
      required: true
  - type: input
    id: image
    attributes:
      label: Freely licensed image on Wikimedia Commons (optional)
      placeholder: "https://commons.wikimedia.org/wiki/File:..."
